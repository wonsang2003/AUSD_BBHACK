[project]
name = "pocketdesk"
version = "0.1.0"
description = "PocketDesk backend: x402 sellers, sector agents, VOI planner, budget allocator and keeper (AUSD on Base Sepolia)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "web3>=7.0",
  "eth-account>=0.13",
  "apscheduler>=3.10,<4",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "chain: needs a local anvil node (auto-skipped if anvil is not installed)",
]

[tool.uv]
package = false
